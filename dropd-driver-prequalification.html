.hero .badge {
  display: inline-block;
  background: rgba(46,204,113,0.18);
  color: var(--lime);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 6px 14px;
  border-radius: 999px;
  margin-bottom: 14px;
}
.hero h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 8px; }
.hero p { color: #C9D9CC; font-size: 0.95rem; line-height: 1.5; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px;
  margin-bottom: 20px;
}

.field { margin-bottom: 20px; }
.field:last-child { margin-bottom: 0; }
label.q {
  display: block;
  font-weight: 700;
  font-size: 0.95rem;
  margin-bottom: 8px;
  color: var(--dark);
}
label.q .req { color: var(--red); margin-left: 3px; }
.hint { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }

input[type=text], input[type=email], input[type=tel], select, textarea {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-family: inherit;
  font-size: 0.95rem;
  color: var(--dark);
  background: #fff;
  transition: border-color 0.15s;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--green);
}
textarea { resize: vertical; min-height: 90px; }

.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 480px) { .row2 { grid-template-columns: 1fr; } }

.opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 480px) { .opt-grid { grid-template-columns: 1fr; } }

.opt {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  cursor: pointer;
  font-size: 0.9rem;
  transition: border-color 0.15s, background 0.15s;
}
.opt:hover { border-color: var(--green); }
.opt input { width: 16px; height: 16px; accent-color: var(--green); flex-shrink: 0; }
.opt.checked, .opt.selected { border-color: var(--green); background: #EEFBF2; }

.radio-row { display: flex; gap: 12px; flex-wrap: wrap; }
.radio-row .opt { flex: 1; min-width: 100px; justify-content: center; }

.submit-btn {
  width: 100%;
  background: var(--green);
  color: var(--dark);
  border: none;
  border-radius: 12px;
  padding: 16px;
  font-size: 1rem;
  font-weight: 800;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
}
.submit-btn:hover { background: var(--lime); }
.submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

.status {
  display: none;
  margin-top: 16px;
  padding: 14px 16px;
  border-radius: 10px;
  font-size: 0.9rem;
  font-weight: 600;
  text-align: center;
}
.status.error   { display: block; background: #FDEEEE; color: var(--red); }
.status.loading { display: block; background: #F2F7F3; color: var(--muted); }
.status.success { display: block; background: #EAFBF0; color: #1A7A3D; }

.foot { text-align: center; font-size: 0.8rem; color: var(--muted); margin-top: 20px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <span class="badge">Drive with DROPD</span>
    <h1>Driver Prequalification</h1>
    <p>Answer a few quick questions to see if you're a fit. Takes under 2 minutes — no documents needed yet.</p>
  </div>

  <div class="card">
    <div class="field">
      <label class="q">Full Name<span class="req">*</span></label>
      <div class="row2">
        <input type="text" id="firstName" placeholder="First name">
        <input type="text" id="lastName" placeholder="Last name">
      </div>
    </div>

    <div class="field">
      <label class="q">WhatsApp Number<span class="req">*</span></label>
      <input type="tel" id="whatsapp" placeholder="(000) 000-0000">
    </div>

    <div class="field">
      <label class="q">Email Address</label>
      <input type="email" id="email" placeholder="example@example.com">
    </div>

    <div class="field">
      <label class="q">Vehicle Type<span class="req">*</span></label>
      <div class="radio-row" id="vehicleType">
        <label class="opt"><input type="radio" name="vehicleType" value="Car"> Car</label>
        <label class="opt"><input type="radio" name="vehicleType" value="Bike"> Bike</label>
        <label class="opt"><input type="radio" name="vehicleType" value="Van"> Van</label>
      </div>
    </div>

    <div class="field">
      <label class="q">Licence Plate<span class="req">*</span></label>
      <input type="text" id="licencePlate" placeholder="e.g. PBM 1234">
    </div>

    <div class="field">
      <label class="q">Areas You Can Cover<span class="req">*</span></label>
      <div class="opt-grid" id="areas">
        <label class="opt"><input type="checkbox" value="POS"> POS</label>
        <label class="opt"><input type="checkbox" value="Arima"> Arima</label>
        <label class="opt"><input type="checkbox" value="Chaguanas"> Chaguanas</label>
        <label class="opt"><input type="checkbox" value="San Fernando"> San Fernando</label>
        <label class="opt"><input type="checkbox" value="Couva"> Couva</label>
        <label class="opt"><input type="checkbox" value="Sangre Grande"> Sangre Grande</label>
        <label class="opt"><input type="checkbox" value="Tobago"> Tobago</label>
        <label class="opt"><input type="checkbox" value="All areas"> All areas</label>
      </div>
    </div>

    <div class="field">
      <label class="q">Available Hours<span class="req">*</span></label>
      <div class="opt-grid" id="hours">
        <label class="opt"><input type="checkbox" value="Mornings"> Mornings</label>
        <label class="opt"><input type="checkbox" value="Afternoons"> Afternoons</label>
        <label class="opt"><input type="checkbox" value="Evenings"> Evenings</label>
        <label class="opt"><input type="checkbox" value="Weekends"> Weekends</label>
        <label class="opt"><input type="checkbox" value="Flexible"> Flexible</label>
      </div>
    </div>

    <div class="field">
      <label class="q">Do you have a smartphone?<span class="req">*</span></label>
      <div class="radio-row" id="smartphone">
        <label class="opt"><input type="radio" name="smartphone" value="Yes"> Yes</label>
        <label class="opt"><input type="radio" name="smartphone" value="No"> No</label>
      </div>
    </div>

    <div class="field">
      <label class="q">Why do you want to join DROPD?<span class="req">*</span></label>
      <textarea id="why" placeholder="Tell us in a sentence or two..."></textarea>
    </div>

    <div class="field">
      <label class="q">How did you hear about us?</label>
      <select id="heard">
        <option value="">Please Select</option>
        <option>Social Media</option>
        <option>Friend/Family</option>
        <option>Online Advertisement</option>
        <option>Flyer</option>
        <option>Other</option>
      </select>
    </div>

    <div class="field">
      <button class="submit-btn" id="submitBtn" onclick="submitForm()">Submit Application</button>
      <div class="status" id="statusMsg"></div>
    </div>
  </div>

  <p class="foot">© 2026 DROPD Logistics · Trinidad &amp; Tobago</p>
</div>

<script>
// ── Set this to your DROPD Data Hub Apps Script Web App URL ──
const SHEET_URL = 'https://script.google.com/macros/s/AKfycby01spbYNRri20fF2Y1RYvHzuEFFeWudCB_whCy9BG8Y5XBV0VcYWPitwDqDPkZibd8og/exec';

// ── Visual "checked" state for option cards ──────────────────
document.querySelectorAll('.opt input').forEach(inp => {
  inp.addEventListener('change', () => {
    if (inp.type === 'radio') {
      document.querySelectorAll(`input[name="${inp.name}"]`).forEach(r => {
        r.closest('.opt').classList.toggle('checked', r.checked);
      });
    } else {
      inp.closest('.opt').classList.toggle('checked', inp.checked);
    }
  });
});

function v(id) { const e = document.getElementById(id); return e ? e.value.trim() : ''; }
function getRadio(name) { const e = document.querySelector(`input[name="${name}"]:checked`); return e ? e.value : ''; }
function getChecked(containerId) { return [...document.querySelectorAll('#' + containerId + ' input:checked')].map(e => e.value).join(', '); }
function showStatus(msg, type) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status ' + type;
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

async function submitForm() {
  const firstName = v('firstName'), lastName = v('lastName');
  if (!firstName || !lastName)      { showStatus('Please enter your full name.', 'error'); return; }
  if (!v('whatsapp'))               { showStatus('Please enter your WhatsApp number.', 'error'); return; }
  if (!getRadio('vehicleType'))     { showStatus('Please select your vehicle type.', 'error'); return; }
  if (!v('licencePlate'))           { showStatus('Please enter your licence plate.', 'error'); return; }
  if (!getChecked('areas'))         { showStatus('Please select at least one area you can cover.', 'error'); return; }
  if (!getChecked('hours'))         { showStatus('Please select at least one available hours option.', 'error'); return; }
  if (!getRadio('smartphone'))      { showStatus('Please answer the smartphone question.', 'error'); return; }
  if (!v('why'))                    { showStatus('Please tell us why you want to join DROPD.', 'error'); return; }

  showStatus('Submitting…', 'loading');

  const payload = {
    form_type:        'driver_prequalification',
    Timestamp:        new Date().toLocaleString('en-TT'),
    'Full Name':       firstName + ' ' + lastName,
    'WhatsApp':        v('whatsapp'),
    'Email':           v('email'),
    'Vehicle Type':    getRadio('vehicleType'),
    'Licence Plate':   v('licencePlate'),
    'Areas Covered':   getChecked('areas'),
    'Available Hours': getChecked('hours'),
    'Smartphone':      getRadio('smartphone'),
    'Why Join DROPD':  v('why'),
    'Heard About Us':  v('heard')
  };

  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;

  if (!SHEET_URL || SHEET_URL === 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE') {
    console.log('DROPD Prequalification submission:', payload);
    showStatus('✅ Application received! We will be in touch soon.', 'success');
    submitBtn.disabled = false;
    return;
  }

  try {
    await fetch(SHEET_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    });
  } catch (err) {
    // With mode: 'no-cors' the browser hides the real response, so fetch()
    // can throw here even when the submission actually reached the sheet
    // (e.g. an ad blocker or privacy extension interrupting the opaque
    // response). We log it for debugging but don't show it as a hard
    // failure to the user, since we have no reliable way to distinguish
    // a real failure from a false positive in no-cors mode.
    console.warn('Submission fetch reported an error (may be a false positive due to no-cors):', err);
  }

  showStatus('✅ Thanks! Your prequalification has been received. We will reach out on WhatsApp within 24-72 hours.', 'success');
}
</script>
</body>
</html>
